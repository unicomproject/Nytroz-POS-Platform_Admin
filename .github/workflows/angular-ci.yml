name: Angular Platform Admin CI & Quality Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *' # Tier 3 Nightly Regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1-pr-gate:
    name: Tier 1 - PR Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production Compile
        run: npm run build

      - name: Run Unit & Component Tests
        run: npm test -- --watch=false

  tier2-main-gate:
    name: Tier 2 - Main Branch Quality Gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: tier1-pr-gate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full Build & Type Verification
        run: npm run build

      - name: Full Angular Unit Suite
        run: npm test -- --watch=false
