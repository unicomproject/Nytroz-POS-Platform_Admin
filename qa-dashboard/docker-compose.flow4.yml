name: oneverz-flow4

services:
  postgres:
    image: postgres:17-alpine
    container_name: oneverz-flow4-postgres
    restart: "no"
    environment:
      POSTGRES_DB: oneverz_flow4_e2e
      POSTGRES_USER: flow4_e2e
      POSTGRES_PASSWORD: ${FLOW4_POSTGRES_PASSWORD:?Set FLOW4_POSTGRES_PASSWORD in the process environment}
    ports:
      - "127.0.0.1:55432:5432"
    networks: [flow4]
    volumes:
      - oneverz-flow4-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow4_e2e -d oneverz_flow4_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.4
    container_name: oneverz-flow4-clamav
    restart: "no"
    ports:
      - "127.0.0.1:53310:3310"
    networks: [flow4]
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: oneverz-flow4-azurite
    restart: "no"
    command: azurite-blob --blobHost 0.0.0.0 --location /data --silent
    ports:
      - "127.0.0.1:10000:10000"
    networks: [flow4]
    volumes:
      - oneverz-flow4-azurite-data:/data

networks:
  flow4:
    name: oneverz-flow4-e2e

volumes:
  oneverz-flow4-postgres-data:
    name: oneverz-flow4-postgres-data
  oneverz-flow4-azurite-data:
    name: oneverz-flow4-azurite-data
